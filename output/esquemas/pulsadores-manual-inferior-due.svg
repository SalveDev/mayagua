  <text x="40" y="535">Configura las 12 entradas como INPUT_PULLUP. En reposo leen HIGH y al pulsar leen LOW.</text>
  <text x="40" y="559">El cableado de teclas usa D22–D43. Cada pulsador lleva su propia señal y comparte el retorno GND.</text>
  <text x="40" y="583" class="small">La posición de los pulsadores sigue el modelo OpenSCAD. El diámetro visible no especifica el taladro de montaje.</text>
