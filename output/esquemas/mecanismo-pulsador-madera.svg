  <text x="20" y="92" class="small">Cabeza Ø18 mm</text>
  <text x="110" y="68" class="small">Faldón</text>
  <text x="204" y="76" class="small">Tornillo de tope</text>
  <text x="329" y="92" class="small">Microinterruptor NO</text>
