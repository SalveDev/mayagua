<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Mecanismo del pulsador de madera · Mayagua</title>
<desc id="desc">Dos cortes laterales muestran el émbolo en reposo y pulsado. Un resorte entre el collarín móvil y un soporte fijo devuelve el botón. Un tornillo limita el recorrido y el vástago acciona un microinterruptor.</desc>
<defs>
  <pattern id="madera" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <rect width="8" height="8" fill="#f4e4cf"/>
    <path d="M0 0v8" stroke="#c59a70" stroke-width="2"/>
  </pattern>
  <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#176481"/>
  </marker>
  <style>
    text{font:15px Arial,sans-serif;fill:#243340}.title{font:bold 32px Arial,sans-serif}.panel{font:bold 20px Arial,sans-serif}.small{font-size:13px}.bold{font-weight:bold}
    .edge{stroke:#314450;stroke-width:1.5}.axis{stroke:#94a8b3;stroke-dasharray:6 5}.guide{fill:#f7f8fa}.metal{fill:#b4d5e3}.fixed{fill:#ccd3d8}.wood{fill:url(#madera)}
    .lead{fill:none;stroke:#647b88;stroke-width:1.25}.spring{fill:none;stroke:#985113;stroke-width:3;stroke-linejoin:round}.arrow{stroke:#176481;stroke-width:2;marker-end:url(#flecha)}
  </style>
</defs>
<rect width="1200" height="590" fill="white"/>
<text x="40" y="53" class="title">Mayagua · Mecanismo del pulsador de madera</text>
<text x="40" y="81">Manual inferior · Corte lateral · El músico queda a la izquierda</text>
<g transform="translate(40,108)">
  <rect width="550" height="322" rx="10" fill="#fbfcfd" stroke="#d7e0e5"/>
