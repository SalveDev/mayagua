  <text x="76" y="256" text-anchor="middle" class="small">Casquillo guía</text>
  <text x="177" y="256" text-anchor="middle" class="small">Collarín móvil</text>
  <text x="240" y="256" text-anchor="middle" class="small">Resorte</text>
  <text x="344" y="256" class="small">Soporte fijo</text>
  <path d="M22 153H58" class="arrow"/><text x="20" y="295" class="small">El collarín toca el tope. El vástago mantiene cerrado el contacto.</text>
</g>
<path d="M40 456H1160" stroke="#d7e0e5"/>
<text x="40" y="484" class="bold">Medidas para el prototipo</text>
<text x="40" y="510">Cabeza de madera Ø18 mm · Faldón del modelo de 12.7 mm · Vástago liso de Ø6 mm propuesto</text>
<text x="40" y="535">Ajusta el tope para empezar con 1–1.5 mm de recorrido total. Regula el microinterruptor para que cierre antes del tope.</text>
<text x="40" y="560" class="small">Dibujo sin escala. Se amplificó el movimiento para que se vea. Una guía con cara plana evita que gire la leyenda.</text>
</svg>
