  <path d="M190 175 L197.69 179 L205.38 171 L213.08 179 L220.77 171 L228.46 179 L236.15 171 L243.85 179 L251.54 171 L259.23 179 L266.92 171 L274.62 179 L282.31 171 L290 175" class="spring"/>
  <rect x="47" y="109" width="28" height="88" rx="8" class="wood edge"/>
