  <path d="M208 142 L214.31 146 L220.62 138 L226.92 146 L233.23 138 L239.54 146 L245.85 138 L252.15 146 L258.46 138 L264.77 146 L271.08 138 L277.38 146 L283.69 138 L290 142" class="spring"/>
  <path d="M208 175 L214.31 179 L220.62 171 L226.92 179 L233.23 171 L239.54 179 L245.85 171 L252.15 179 L258.46 171 L264.77 179 L271.08 171 L277.38 179 L283.69 171 L290 175" class="spring"/>
