<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" role="img" aria-labelledby="title desc">
  <title id="title">Mayagua · Pulsadores del manual inferior</title>
  <desc id="desc">Vista desde el músico con SET a la izquierda, memorias 1 a 10 al centro y CANCEL a la derecha. Los doce pulsadores normalmente abiertos conectan entradas independientes del Arduino Due a tierra común.</desc>
